name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.5
          actions-cache-folder: emsdk-cache

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build WebAssembly
        shell: bash
        run: |
          em++ \
            -std=c++17 \
            -O3 \
            -DNDEBUG \
            -Iinclude \
            src/wasm_wrapper.cpp \
            --no-entry \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sENVIRONMENT=web \
            -sEXPORTED_FUNCTIONS='[
              "_game_create",
              "_game_destroy",
              "_game_make_move",
              "_game_best_move",
              "_game_turn",
              "_game_last_move",
              "_game_is_available",
              "_game_set_turn",
              "_game_set_board_position"
            ]' \
            -o web/divisor_geography.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
